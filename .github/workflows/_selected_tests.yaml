name: Selected Tests

on:
  workflow_call:
    inputs:
      vllm:
        type: string
        required: true
        description: 'The vllm commit hash or tag to test.'
      test_groups:
        type: string
        required: true
        description: 'JSON array of test groups from select_tests.py'
      ref:
        type: string
        required: false
        default: ''
        description: 'The vllm-ascend ref to test.'
      base_ref:
        type: string
        required: false
        default: 'main'
        description: 'The base branch to rebase onto (e.g. main, v0.8.x).'
      ref_is_merge_commit:
        type: boolean
        required: false
        default: false
        description: 'The supplied ref is already GitHub merge-tested against its base.'
      upload_timing:
        type: boolean
        required: false
        default: false
        description: 'Upload test_timing_data.json as artifact'
      continue_on_error:
        type: boolean
        required: false
        default: false
        description: 'Continue running the job even if tests fail'

# Bash shells do not use ~/.profile or ~/.bashrc so these shells need to be explicitly
# declared as "shell: bash -el {0}" on steps that need to be properly activated.
# It's used to activate ascend-toolkit environment variables.
defaults:
  run:
    shell: bash -el {0}

permissions:
  contents: read

jobs:
  selected-tests:
    name: ${{ matrix.group.npu_type }}-${{ matrix.group.num_npus }} card-${{ matrix.group.partition && format('(part {0})', matrix.group.partition) || '' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.test_groups) }}
    runs-on: ${{ matrix.group.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ matrix.group.image_tag }}
      options: >-
        ${{
          matrix.group.device_runner == true &&
          format('--device /dev/davinci{0}:/dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc --volume /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro --volume /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro --volume /data/actions-runners/git-cache:/__git-cache:ro --volume /data/actions-runners/tools/uv:/usr/local/bin/uv:ro --volume /data/actions-runners/tools/zstd:/usr/local/bin/zstd:ro --volume /data/actions-runners/tools/zstd:/usr/local/bin/zstdmt:ro --volume /data/actions-runners/uv-cache-npu{0}:/__uv-cache --volume /data/shared_models/modelscope_cache:/__modelscope_seed:ro --volume /data/actions-runners/huggingface-cache-npu{0}:/github/home/.cache/huggingface --volume /data/actions-runners/vllm-assets:/github/home/.cache/vllm/assets:ro --volume /data/actions-runners/csrc-cache-artifacts:/__csrc-cache:ro --volume /data/actions-runners/rdma-debs:/__rdma-debs:ro --volume /data/actions-runners/mooncake-wheels:/__mooncake-wheels:ro', matrix.group.device_id) ||
          matrix.group.runner == 'linux-aarch64-a2b3-1' &&
          '--device /dev/davinci1 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc --volume /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro --volume /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro' ||
          ''
        }}
      env:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_MODELSCOPE: True
        HF_HUB_OFFLINE: 1
        ASCEND_RT_VISIBLE_DEVICES: ${{ matrix.group.device_runner == true && '0' || (matrix.group.runner == 'linux-aarch64-a2b3-1' && '1' || '') }}
        MAX_JOBS: 4
        UV_INDEX_URL: ${{ (matrix.group.device_runner == true || matrix.group.runner == 'linux-aarch64-a2b3-1') && 'https://pypi.org/simple' || 'http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple' }}
        UV_EXTRA_INDEX_URL: ${{ (matrix.group.device_runner == true || matrix.group.runner == 'linux-aarch64-a2b3-1') && 'https://repo.huaweicloud.com/ascend/repos/pypi' || 'https://repo.huaweicloud.com/ascend/repos/pypi http://cache-service.nginx-pypi-cache.svc.cluster.local/whl/cpu/' }}
        UV_INDEX_STRATEGY: unsafe-best-match
        UV_INSECURE_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
        UV_HTTP_TIMEOUT: 120
        UV_NO_CACHE: ${{ matrix.group.device_runner == true && '0' || '1' }}
        UV_CACHE_DIR: /__uv-cache
        UV_LINK_MODE: symlink
        UV_SYSTEM_PYTHON: 1
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: http.version
        GIT_CONFIG_VALUE_0: HTTP/1.1
    steps:
      - name: Checkout vllm-project/vllm-ascend repo
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.ref }}
          EXPECTED_REF_SHA: ${{ inputs.ref_is_merge_commit && github.sha || '' }}
        run: |
          set -euo pipefail
          cache=/__git-cache/vllm-ascend-hust.git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$cache"
          if [[ "$CHECKOUT_REF" =~ ^[0-9a-f]{40}$ ]] \
            && [ -d "$cache" ] \
            && git --git-dir="$cache" cat-file -e "${CHECKOUT_REF}^{commit}"; then
            checkout_sha=$(git --git-dir="$cache" rev-parse "${CHECKOUT_REF}^{commit}")
            git init .
            git remote remove origin 2>/dev/null || true
            git remote add origin "$cache"
            git fetch --no-tags origin "$checkout_sha"
            git checkout --force --detach FETCH_HEAD
            git clean -ffdx
          else
            git init .
            git remote remove origin 2>/dev/null || true
            git remote add origin https://github.com/${{ github.repository }}.git
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --filter=blob:none --depth=1 origin "$CHECKOUT_REF"; then
                git checkout --detach FETCH_HEAD
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          checkout_sha=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_REF_SHA" ] && [ "$checkout_sha" != "$EXPECTED_REF_SHA" ]; then
            echo "::error::Checked out ${checkout_sha}, expected ${EXPECTED_REF_SHA}"
            exit 1
          fi
          git submodule update --init --recursive

      - name: Validate Ascend container runtime
        if: ${{ matrix.group.npu_type != 'cpu' }}
        run: |
          python3 .github/workflows/scripts/check_ascend_container_runtime.py \
            --expected-npus "${{ matrix.group.num_npus }}"

      - name: Install packages
        run: |
          if [ "${{ matrix.group.device_runner }}" = "true" ]; then
            for tool in git gcc g++ cmake curl uv zstd zstdmt; do
              command -v "$tool"
            done
            modelscope_cache="${RUNNER_TEMP}/modelscope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.group.device_id }}"
            mkdir -p "${modelscope_cache}/models"
            cp -as /__modelscope_seed/. "${modelscope_cache}/models/"
            while IFS= read -r -d '' metadata; do
              materialized="${metadata}.materialized"
              cp --dereference --preserve=mode,timestamps "$metadata" "$materialized"
              mv -f "$materialized" "$metadata"
            done < <(find "${modelscope_cache}/models" -type l \
              \( -name .mdl -o -name .msc -o -name .mv \) -print0)
            echo "MODELSCOPE_CACHE=${modelscope_cache}" >> "$GITHUB_ENV"
            test -f "${modelscope_cache}/models/Qwen/Qwen3-0___6B/config.json"
            test ! -L "${modelscope_cache}/models/Qwen/Qwen3-0___6B/.mdl"
            uv --version
            exit 0
          fi
          if [ "${{ matrix.group.runner }}" != "linux-aarch64-a2b3-1" ]; then
            sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
            pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
            pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local
          fi
          apt-get update -y
          apt-get install -y python3-pip git vim wget net-tools gcc g++ cmake libnuma-dev curl gnupg2 zstd
          git config --global --add safe.directory /__w/vllm-ascend/vllm-ascend
          pip install uv

      - name: Checkout vllm-project/vllm repo
        env:
          VLLM_REF: ${{ inputs.vllm }}
        run: |
          set -euo pipefail
          cache=/__git-cache/vllm.git
          git config --global --add safe.directory "$cache"
          mkdir -p ./vllm-empty
          cd ./vllm-empty
          if [ -d "$cache" ] && git --git-dir="$cache" cat-file -e "${VLLM_REF}^{commit}"; then
            checkout_sha=$(git --git-dir="$cache" rev-parse "${VLLM_REF}^{commit}")
            git init .
            git remote remove origin 2>/dev/null || true
            git remote add origin "$cache"
            git fetch --no-tags origin "$checkout_sha"
            git checkout --force --detach FETCH_HEAD
            git clean -ffdx
          else
            git init .
            git remote remove origin 2>/dev/null || true
            git remote add origin https://github.com/vllm-project/vllm.git
            for attempt in 1 2 3 4 5; do
              if git fetch --no-tags --filter=blob:none --depth=1 origin "$VLLM_REF"; then
                git checkout --detach FETCH_HEAD
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi
          if [[ "$VLLM_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([a-z]+[0-9]+)?)$ ]]; then
            echo "VLLM_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi

      - name: Install vllm-project/vllm from source
        working-directory: ./vllm-empty
        run: |
          VLLM_TARGET_DEVICE=empty uv pip install .
          pip uninstall -y triton

      - name: Rebase on latest ${{ inputs.base_ref }}
        if: ${{ !inputs.ref_is_merge_commit }}
        run: |
          git config user.name "vllm-ascend-ci"
          git config user.email "vllm-ascend-ci@users.noreply.github.com"
          git fetch origin ${{ inputs.base_ref }}
          git rebase origin/${{ inputs.base_ref }}

      - name: Get csrc hash
        id: get_csrc_hash
        run: |
          CSRC_HASH=$(find ./csrc ./setup.py ./CMakeLists.txt ./cmake \
            -type f -not -path '*/.*' | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "CSRC_HASH=$CSRC_HASH" >> $GITHUB_OUTPUT

      - name: Get architecture
        id: get_arch
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) echo "arch=X64" >> $GITHUB_OUTPUT ;;
            aarch64) echo "arch=ARM64" >> $GITHUB_OUTPUT ;;
            *) echo "arch=$ARCH" >> $GITHUB_OUTPUT ;;
          esac

      - uses: dorny/paths-filter@v4
        id: csrc-filter
        if: ${{ matrix.group.npu_type != 'cpu' }}
        with:
          filters: |
            csrc:
              - 'csrc/**'
              - 'setup.py'
              - 'CMakeLists.txt'
              - 'cmake/**'

      - name: Restore vllm-ascend csrc cache
        id: cache-csrc
        if: ${{ matrix.group.npu_type != 'cpu' }}
        uses: runs-on/cache/restore@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v1-${{ steps.get_arch.outputs.arch }}-${{ matrix.group.image_tag }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

      - name: Restore runner-local vllm-ascend csrc cache
        if: ${{ matrix.group.device_runner == true && steps.cache-csrc.outputs.cache-hit != 'true' }}
        run: |
          local_cache="/__csrc-cache/${{ steps.get_csrc_hash.outputs.CSRC_HASH }}/vllm_ascend"
          if [ -d "${local_cache}" ]; then
            cp -a "${local_cache}/." vllm_ascend/
            find vllm_ascend -maxdepth 1 -name '*.so' -type f | grep -q .
            echo "Restored runner-local CSRC cache for ${{ steps.get_csrc_hash.outputs.CSRC_HASH }}"
          else
            echo "Runner-local CSRC cache miss for ${{ steps.get_csrc_hash.outputs.CSRC_HASH }}"
          fi

      - name: Install Mooncake wheel
        if: ${{ matrix.group.npu_type != 'cpu' }}
        run: |
          set -euxo pipefail

          if [ "${{ matrix.group.device_runner }}" = "true" ]; then
            test "$(dpkg-deb -f /__rdma-debs/libibverbs1_39.0-1_arm64.deb Version)" = "39.0-1"
            test "$(dpkg-deb -f /__rdma-debs/ibverbs-providers_39.0-1_arm64.deb Version)" = "39.0-1"
            test "$(dpkg-deb -f /__rdma-debs/librdmacm1_39.0-1_arm64.deb Version)" = "39.0-1"
            apt-get install -y --no-install-recommends /__rdma-debs/*.deb
          else
            apt-get install -y --no-install-recommends \
              libibverbs1 \
              ibverbs-providers \
              librdmacm1 \
              libnuma1 \
              libcurl4
          fi
          ldconfig

          MOONCAKE_WHEEL="mooncake_transfer_engine_ascend-0.3.9-cp312-cp312-manylinux_2_35_aarch64.whl"
          if [ "${{ matrix.group.device_runner }}" = "true" ]; then
            echo "1efdc126efe553d53fda70923d6c67643058c27044360a73bd55252916f37cfc  /__mooncake-wheels/${MOONCAKE_WHEEL}" \
              | sha256sum -c -
            pip install --no-cache-dir --no-deps "/__mooncake-wheels/${MOONCAKE_WHEEL}"
          else
            pip install --no-cache-dir --no-deps \
              "https://vllm-ascend.obs.cn-north-4.myhuaweicloud.com/vllm-ascend/${MOONCAKE_WHEEL}"
          fi

          pip show mooncake-transfer-engine-ascend || true

      - name: Install vllm-project/vllm-ascend with device
        if: ${{ matrix.group.npu_type != 'cpu' }}
        run: |
          export MAX_JOBS=$(( ${{ matrix.group.num_npus }} * 23 ))
          pip install uc-manager
          uv pip install -r requirements-dev.txt
          uv pip install --force-reinstall --no-deps triton-ascend==3.2.1
          if find vllm_ascend -maxdepth 1 -name '*.so' -type f 2>/dev/null | grep -q .; then
            echo "CSRC cache hit: .so files found, skip kernel compilation"
            COMPILE_CUSTOM_KERNELS=0 uv pip install -e .
          else
            echo "CSRC cache miss: no .so files found, compile kernels"
            uv pip install -e . --no-build-isolation
          fi

      - name: Materialize torch-npu paths rejected by symlink checks
        if: ${{ matrix.group.device_runner == true }}
        run: |
          python - <<'PY'
          import shutil
          import site
          from pathlib import Path

          root = Path(site.getsitepackages()[0]) / "torch_npu"
          symlinks = sorted(path for path in root.rglob("*") if path.is_symlink())
          for path in symlinks:
              target = path.resolve(strict=True)
              materialized = path.with_name(f".{path.name}.materialized")
              if target.is_dir():
                  shutil.copytree(target, materialized, symlinks=False)
              else:
                  shutil.copy2(target, materialized, follow_symlinks=True)
              path.unlink()
              materialized.replace(path)
          print(f"Materialized {len(symlinks)} torch-npu cache links")
          PY
          torch_npu_root="$(python -c 'import site; print(site.getsitepackages()[0])')/torch_npu"
          test ! -L "${torch_npu_root}/lib/libop_plugin_atb.so"

      - name: Save vllm-ascend csrc cache
        if: ${{ matrix.group.npu_type != 'cpu' && steps.cache-csrc.outputs.cache-hit != 'true' }}
        uses: runs-on/cache/save@v5
        with:
          path: |
            vllm_ascend/_cann_ops_custom
            vllm_ascend/*.so
            vllm_ascend/lib
            vllm_ascend/include
          key: vllm-ascend-build-v1-${{ steps.get_arch.outputs.arch }}-${{ matrix.group.image_tag }}-${{ steps.get_csrc_hash.outputs.CSRC_HASH }}

      - name: Verify required AscendC custom ops are registered (310p)
        if: ${{ matrix.group.npu_type == '310p' }}
        run: |
          python - <<'PY'
          import sys, torch
          import vllm_ascend.vllm_ascend_C  # noqa: F401
          ops = torch.ops._C_ascend
          missing = [n for n in ("chunk_gated_delta_rule_fwd_h", "chunk_fwd_o") if not hasattr(ops, n)]
          if missing:
              print(f"::error::Missing AscendC ops after install: {missing}. "
                    f"Cache contents are stale or build skipped registration.", file=sys.stderr)
              sys.exit(1)
          print("AscendC chunk-gdr ops registered:",
                [n for n in ("chunk_gated_delta_rule_fwd_h", "chunk_fwd_o") if hasattr(ops, n)])
          PY

      - name: Install vllm-project/vllm-ascend no device
        if: ${{ matrix.group.npu_type == 'cpu' }}
        env:
          SOC_VERSION: ascend910b1
          COMPILE_CUSTOM_KERNELS: 0
        run: |
          pip install uc-manager
          uv pip install -r requirements-dev.txt
          uv pip install -e .

      - name: Uninstall Triton for 310P tests
        if: ${{ matrix.group.npu_type != 'cpu' && matrix.group.npu_type == '310p' }}
        run: |
          pip uninstall -y triton-ascend triton

      - name: Run selected tests with device
        if: ${{ matrix.group.npu_type != 'cpu' }}
        continue-on-error: ${{ inputs.continue_on_error }}
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: |
          . /usr/local/Ascend/ascend-toolkit/set_env.sh
          TIMING_FLAG=""
          if [ "${{ inputs.upload_timing }}" = "true" ]; then
            TIMING_FLAG="--timing"
          fi
          .github/workflows/scripts/run_selected_tests.sh \
            "${{ matrix.group.npu_type }}" \
            "${{ matrix.group.num_npus }}" \
            "with-device" \
            ${TIMING_FLAG} \
            ${{ matrix.group.tests }}

      - name: Run selected tests without device
        if: ${{ matrix.group.npu_type == 'cpu' }}
        continue-on-error: ${{ inputs.continue_on_error }}
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          TORCH_DEVICE_BACKEND_AUTOLOAD: 0
        run: |
          .github/workflows/scripts/run_selected_tests.sh \
            "${{ matrix.group.npu_type }}" \
            "${{ matrix.group.num_npus }}" \
            "without-device" \
            ${{ matrix.group.tests }}

      - name: Upload timing data
        if: ${{ inputs.upload_timing && matrix.group.npu_type != 'cpu' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: timing-data-${{ matrix.group.npu_type }}-${{ matrix.group.num_npus }}card-${{ matrix.group.partition }}
          path: ${{ runner.temp }}/selected-tests-*/test_timing_data.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload selected test logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: selected-test-logs-vllm-${{ inputs.vllm }}-${{ matrix.group.npu_type }}-${{ matrix.group.num_npus }}card
          path: ${{ runner.temp }}/selected-tests-*
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Remove per-job ModelScope cache view
        if: ${{ always() && matrix.group.device_runner == true }}
        run: |
          if [ -z "${MODELSCOPE_CACHE:-}" ]; then
            exit 0
          fi
          case "${MODELSCOPE_CACHE:-}" in
            "${RUNNER_TEMP}"/modelscope-"${GITHUB_RUN_ID}"-"${GITHUB_RUN_ATTEMPT}"-*)
              rm -rf --one-file-system "$MODELSCOPE_CACHE"
              ;;
            *)
              echo "::error::Refusing to remove unexpected ModelScope cache path: ${MODELSCOPE_CACHE:-<unset>}"
              exit 1
              ;;
          esac
